name: Translation correction
description: Report wording that is missing, inaccurate, or unnatural.
title: "[translation]: "
labels:
  - translation
body:
  - type: dropdown
    id: locale
    attributes:
      label: Locale
      options:
        - German (de)
        - Swabian (swg)
        - Bavarian (bar)
        - English source text
    validations:
      required: true
  - type: input
    id: panel-version
    attributes:
      label: Pterodactyl Panel version
      placeholder: "1.15.0"
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: Location in the Panel
      description: Name the page, dialog, tab, or action. Do not include server addresses or other private data.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current wording
    validations:
      required: true
  - type: textarea
    id: suggested
    attributes:
      label: Suggested wording
      description: For dialects, mention the regional usage you are targeting when useful.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed hostnames, addresses, tokens, user details, and other private infrastructure data.
          required: true
